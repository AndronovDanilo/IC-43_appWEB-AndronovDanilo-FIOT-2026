<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="objectBoundingBox">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="objectBoundingBox">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="hero-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="btn-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>

  <!-- Figma Canvas Background -->
  <rect width="1200" height="900" fill="#1e1e1e"/>

  <!-- Figma Top Bar / Rulers & Title -->
  <g transform="translate(50, 22)">
    <rect x="0" y="0" width="24" height="20" rx="3" fill="#0d99ff"/>
    <text x="7" y="15" fill="#ffffff" font-size="12" font-weight="900">❖</text>
    <text x="32" y="15" fill="#ffffff" font-size="14" font-weight="600">MandryStay / Desktop Frame (1440 × 1024)</text>
    <rect x="350" y="2" width="75" height="18" rx="9" fill="#2c2c2c"/>
    <text x="387" y="15" fill="#94a3b8" font-size="11" font-weight="500" text-anchor="middle">1440 px</text>
    <rect x="435" y="2" width="110" height="18" rx="9" fill="#2c2c2c"/>
    <text x="490" y="15" fill="#38bdf8" font-size="11" font-weight="500" text-anchor="middle">Auto Layout Grid</text>
  </g>

  <!-- Main Figma Artboard Container (1440px desktop scaled to 1100px) -->
  <g transform="translate(50, 52)" filter="url(#shadow)">
    <!-- Artboard Canvas -->
    <rect width="1100" height="800" rx="8" fill="#f8fafc"/>

    <!-- Browser Chrome / Header Bar -->
    <rect width="1100" height="32" rx="8" fill="#e2e8f0"/>
    <rect y="24" width="1100" height="8" fill="#e2e8f0"/>
    <!-- Window controls -->
    <circle cx="20" cy="16" r="5" fill="#ef4444"/>
    <circle cx="36" cy="16" r="5" fill="#eab308"/>
    <circle cx="52" cy="16" r="5" fill="#22c55e"/>
    <!-- URL bar -->
    <rect x="80" y="6" width="460" height="20" rx="5" fill="#ffffff"/>
    <text x="95" y="19" fill="#64748b" font-size="11">https://andronovdanilo.github.io/IC-43_appWEB-AndronovDanilo-FIOT-2026/</text>

    <!-- WEBSITE CONTENT -->
    <!-- 1. Navigation Header -->
    <g transform="translate(0, 32)">
      <rect width="1100" height="56" fill="#ffffff"/>
      <line x1="0" y1="56" x2="1100" y2="56" stroke="#e2e8f0" stroke-width="1"/>

      <!-- Brand Logo -->
      <g transform="translate(40, 14)">
        <circle cx="14" cy="14" r="14" fill="#1e3a8a"/>
        <path d="M6 20 L14 8 L22 20 Z" fill="#38bdf8" opacity="0.9"/>
        <text x="36" y="20" fill="#1e3a8a" font-size="18" font-weight="800" letter-spacing="-0.5">Mandry<tspan fill="#0284c7">Stay</tspan></text>
      </g>

      <!-- Nav links -->
      <g transform="translate(480, 20)" font-size="13" font-weight="500" fill="#475569">
        <text x="0" y="15" fill="#0284c7" font-weight="700">Головна</text>
        <line x1="0" y1="20" x2="50" y2="20" stroke="#0284c7" stroke-width="2"/>
        <text x="75" y="15">Каталог</text>
        <text x="150" y="15">Тарифи</text>
        <text x="220" y="15">Бронювання</text>
        <text x="325" y="15">Резюме</text>
      </g>

      <!-- Auth CTA button -->
      <rect x="940" y="12" width="120" height="32" rx="6" fill="#1e3a8a"/>
      <text x="1000" y="32" fill="#ffffff" font-size="12" font-weight="600" text-anchor="middle">Увійти</text>
    </g>

    <!-- 2. Hero Section Banner -->
    <g transform="translate(0, 88)">
      <rect width="1100" height="200" fill="url(#hero-grad)"/>
      
      <!-- Decorative mountains in hero -->
      <path d="M0 200 L180 80 L350 200 Z" fill="#ffffff" opacity="0.05"/>
      <path d="M220 200 L450 60 L680 200 Z" fill="#ffffff" opacity="0.08"/>
      <path d="M600 200 L850 90 L1100 200 Z" fill="#ffffff" opacity="0.06"/>

      <g transform="translate(50, 45)">
        <rect x="0" y="0" width="150" height="22" rx="11" fill="#ffffff" opacity="0.2"/>
        <text x="75" y="15" fill="#e0f2fe" font-size="11" font-weight="600" text-anchor="middle">✨ ВАРІАНТ №1 / №3</text>
        
        <text x="0" y="55" fill="#ffffff" font-size="26" font-weight="800">Відкрийте найкращі готелі та тури України</text>
        <text x="0" y="80" fill="#bae6fd" font-size="14">Швидке онлайн-бронювання апартаментів, шале в Карпатах та турів вихідного дня</text>
      </g>

      <!-- Search Floating Widget -->
      <g transform="translate(50, 160)" filter="url(#card-shadow)">
        <rect width="1000" height="65" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        
        <!-- Field 1: Destination -->
        <g transform="translate(25, 12)">
          <text x="0" y="12" fill="#64748b" font-size="10" font-weight="600">МІСТО АБО РЕГІОН</text>
          <text x="0" y="32" fill="#0f172a" font-size="13" font-weight="500">Карпати (Яремче, Буковель) ▾</text>
        </g>
        <line x1="270" y1="12" x2="270" y2="52" stroke="#e2e8f0" stroke-width="1"/>

        <!-- Field 2: Dates -->
        <g transform="translate(295, 12)">
          <text x="0" y="12" fill="#64748b" font-size="10" font-weight="600">ДАТИ ЗАЇЗДУ / ВИЇЗДУ</text>
          <text x="0" y="32" fill="#0f172a" font-size="13" font-weight="500">01 лист 2026 — 07 лист 2026</text>
        </g>
        <line x1="540" y1="12" x2="540" y2="52" stroke="#e2e8f0" stroke-width="1"/>

        <!-- Field 3: Guests -->
        <g transform="translate(565, 12)">
          <text x="0" y="12" fill="#64748b" font-size="10" font-weight="600">КІЛЬКІСТЬ ГОСТЕЙ</text>
          <text x="0" y="32" fill="#0f172a" font-size="13" font-weight="500">2 дорослих · 1 номер ▾</text>
        </g>

        <!-- Search button -->
        <rect x="820" y="12" width="160" height="40" rx="8" fill="url(#btn-grad)"/>
        <text x="900" y="36" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">🔍 Знайти житло</text>
      </g>
    </g>

    <!-- 3. Featured Hotels Section -->
    <g transform="translate(50, 320)">
      <text x="0" y="20" fill="#0f172a" font-size="18" font-weight="800">Популярні варіанти розміщення</text>
      <text x="0" y="38" fill="#64748b" font-size="12">Перевірені локації з високим рейтингом та відгуками туристів</text>

      <!-- Hotel Card 1 -->
      <g transform="translate(0, 50)" filter="url(#card-shadow)">
        <rect width="315" height="220" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
        <rect width="315" height="110" rx="8" fill="#e0f2fe"/>
        <rect y="100" width="315" height="10" fill="#e0f2fe"/>
        <path d="M40 110 L100 40 L160 110 Z" fill="#38bdf8" opacity="0.6"/>
        <path d="M130 110 L190 55 L250 110 Z" fill="#0284c7" opacity="0.5"/>
        <rect x="12" y="12" width="80" height="20" rx="4" fill="#16a34a"/>
        <text x="52" y="26" fill="#ffffff" font-size="10" font-weight="700" text-anchor="middle">ТОП ВИБІР</text>

        <text x="16" y="132" fill="#0284c7" font-size="10" font-weight="700">ЯРЕМЧЕ, КАРПАТИ</text>
        <text x="16" y="150" fill="#0f172a" font-size="13" font-weight="700">Еко-шале «Смерековий край»</text>
        <text x="16" y="168" fill="#f59e0b" font-size="11">★ 4.9 <tspan fill="#64748b">(128 відгуків)</tspan></text>
        <line x1="16" y1="178" x2="299" y2="178" stroke="#f1f5f9" stroke-width="1"/>
        <text x="16" y="200" fill="#0f172a" font-size="14" font-weight="800">2 800 ₴ <tspan fill="#64748b" font-size="10" font-weight="400">/ ніч</tspan></text>
        <rect x="215" y="185" width="85" height="26" rx="4" fill="#1e3a8a"/>
        <text x="257" y="202" fill="#ffffff" font-size="11" font-weight="600" text-anchor="middle">Замовити</text>
      </g>

      <!-- Hotel Card 2 -->
      <g transform="translate(342, 50)" filter="url(#card-shadow)">
        <rect width="315" height="220" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
        <rect width="315" height="110" rx="8" fill="#ede9fe"/>
        <rect y="100" width="315" height="10" fill="#ede9fe"/>
        <circle cx="157" cy="55" r="30" fill="#8b5cf6" opacity="0.4"/>
        <rect x="12" y="12" width="70" height="20" rx="4" fill="#2563eb"/>
        <text x="47" y="26" fill="#ffffff" font-size="10" font-weight="700" text-anchor="middle">ЛЮКС</text>

        <text x="16" y="132" fill="#0284c7" font-size="10" font-weight="700">КИЇВ, ЦЕНТР</text>
        <text x="16" y="150" fill="#0f172a" font-size="13" font-weight="700">Готель «Дніпро Панорама»</text>
        <text x="16" y="168" fill="#f59e0b" font-size="11">★ 4.8 <tspan fill="#64748b">(94 відгуки)</tspan></text>
        <line x1="16" y1="178" x2="299" y2="178" stroke="#f1f5f9" stroke-width="1"/>
        <text x="16" y="200" fill="#0f172a" font-size="14" font-weight="800">3 400 ₴ <tspan fill="#64748b" font-size="10" font-weight="400">/ ніч</tspan></text>
        <rect x="215" y="185" width="85" height="26" rx="4" fill="#1e3a8a"/>
        <text x="257" y="202" fill="#ffffff" font-size="11" font-weight="600" text-anchor="middle">Замовити</text>
      </g>

      <!-- Hotel Card 3 -->
      <g transform="translate(685, 50)" filter="url(#card-shadow)">
        <rect width="315" height="220" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
        <rect width="315" height="110" rx="8" fill="#fee2e2"/>
        <rect y="100" width="315" height="10" fill="#fee2e2"/>
        <rect x="110" y="35" width="95" height="50" rx="6" fill="#ef4444" opacity="0.4"/>
        <rect x="12" y="12" width="95" height="20" rx="4" fill="#dc2626"/>
        <text x="59" y="26" fill="#ffffff" font-size="10" font-weight="700" text-anchor="middle">ЗНИЖКА -15%</text>

        <text x="16" y="132" fill="#0284c7" font-size="10" font-weight="700">ЛЬВІВ, СТАРЕ МІСТО</text>
        <text x="16" y="150" fill="#0f172a" font-size="13" font-weight="700">Апарт-готель «Леополіс»</text>
        <text x="16" y="168" fill="#f59e0b" font-size="11">★ 4.95 <tspan fill="#64748b">(210 відгуків)</tspan></text>
        <line x1="16" y1="178" x2="299" y2="178" stroke="#f1f5f9" stroke-width="1"/>
        <text x="16" y="200" fill="#0f172a" font-size="14" font-weight="800">2 100 ₴ <tspan fill="#64748b" font-size="10" font-weight="400">/ ніч</tspan></text>
        <rect x="215" y="185" width="85" height="26" rx="4" fill="#1e3a8a"/>
        <text x="257" y="202" fill="#ffffff" font-size="11" font-weight="600" text-anchor="middle">Замовити</text>
      </g>
    </g>

    <!-- 4. Pricing Table Preview Section -->
    <g transform="translate(50, 610)">
      <rect width="1000" height="125" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#card-shadow)"/>
      <rect width="1000" height="30" rx="8" fill="#1e3a8a"/>
      <rect y="20" width="1000" height="10" fill="#1e3a8a"/>
      <text x="20" y="20" fill="#ffffff" font-size="11" font-weight="700">Таблиця тарифів: Категорія номеру / Сніданок / Wi-Fi / Вартість за добу</text>
      
      <!-- Table Rows (Zebra striped) -->
      <g transform="translate(20, 42)" font-size="11" fill="#334155">
        <text x="0" y="12" font-weight="600">Стандарт (2 місця)</text>
        <text x="300" y="12">Не включено (опціонально)</text>
        <text x="600" y="12" fill="#16a34a">✓ Безкоштовно</text>
        <text x="850" y="12" font-weight="700" fill="#0f172a">1 600 ₴</text>
      </g>
      <rect x="10" y="62" width="980" height="24" fill="#f8fafc"/>
      <g transform="translate(20, 70)" font-size="11" fill="#334155">
        <text x="0" y="12" font-weight="600">Напівлюкс з видом на гори</text>
        <text x="300" y="12" fill="#16a34a">✓ Включено (Шведська лінія)</text>
        <text x="600" y="12" fill="#16a34a">✓ Безкоштовно + SPA</text>
        <text x="850" y="12" font-weight="700" fill="#0f172a">2 400 ₴</text>
      </g>
      <g transform="translate(20, 98)" font-size="11" fill="#334155">
        <text x="0" y="12" font-weight="600">Шале Преміум (до 6 осіб)</text>
        <text x="300" y="12" fill="#16a34a">✓ Повний пансіон (FB)</text>
        <text x="600" y="12" fill="#16a34a">✓ Ultra High-Speed</text>
        <text x="850" y="12" font-weight="700" fill="#0f172a">4 900 ₴</text>
      </g>
    </g>

    <!-- 5. Footer -->
    <g transform="translate(0, 755)">
      <rect width="1100" height="45" rx="0" fill="#0f172a"/>
      <text x="50" y="27" fill="#94a3b8" font-size="11">© 2026 MandryStay. Лабораторна робота №1-3. Студент: Данило Андронов (група ІС-43, Варіант 1)</text>
      <text x="1050" y="27" fill="#38bdf8" font-size="11" text-anchor="end">HTML5 · CSS3 · Flexbox · Responsive</text>
    </g>
  </g>
</svg>