<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 860" width="900" height="860" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <filter id="m-shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="objectBoundingBox">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
    <linearGradient id="m-hero" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <!-- Figma Canvas Background -->
  <rect width="900" height="860" fill="#1e1e1e"/>

  <!-- Top Title -->
  <g transform="translate(45, 22)">
    <rect x="0" y="0" width="24" height="20" rx="3" fill="#0d99ff"/>
    <text x="7" y="15" fill="#ffffff" font-size="12" font-weight="900">❖</text>
    <text x="32" y="15" fill="#ffffff" font-size="14" font-weight="600">MandryStay / Mobile Frames (iPhone 14 — 375 × 812)</text>
    <rect x="420" y="2" width="130" height="18" rx="9" fill="#2c2c2c"/>
    <text x="485" y="15" fill="#38bdf8" font-size="11" font-weight="500" text-anchor="middle">Responsive Viewports</text>
  </g>

  <!-- FRAME 1: Mobile Home Screen (Closed Menu) -->
  <g transform="translate(50, 55)" filter="url(#m-shadow)">
    <!-- Label -->
    <text x="0" y="-8" fill="#94a3b8" font-size="12" font-weight="500">Frame 1: Mobile Home (375 × 760)</text>
    
    <!-- Phone Body -->
    <rect width="360" height="760" rx="30" fill="#f8fafc" stroke="#334155" stroke-width="4"/>
    
    <!-- Notch / Dynamic Island -->
    <rect x="120" y="8" width="120" height="20" rx="10" fill="#0f172a"/>

    <!-- Status Bar -->
    <text x="28" y="23" fill="#0f172a" font-size="11" font-weight="700">9:41</text>
    <text x="330" y="23" fill="#0f172a" font-size="11" font-weight="700" text-anchor="end">5G  100%</text>

    <!-- Mobile Header -->
    <g transform="translate(0, 36)">
      <rect width="360" height="50" fill="#ffffff"/>
      <line x1="0" y1="50" x2="360" y2="50" stroke="#e2e8f0" stroke-width="1"/>
      <text x="20" y="32" fill="#1e3a8a" font-size="16" font-weight="800">Mandry<tspan fill="#0284c7">Stay</tspan></text>
      <!-- Burger Icon -->
      <g transform="translate(315, 20)">
        <line x1="0" y1="0" x2="22" y2="0" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round"/>
        <line x1="0" y1="6" x2="22" y2="6" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round"/>
        <line x1="0" y1="12" x2="22" y2="12" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round"/>
      </g>
    </g>

    <!-- Mobile Hero -->
    <g transform="translate(0, 86)">
      <rect width="360" height="140" fill="url(#m-hero)"/>
      <text x="20" y="35" fill="#ffffff" font-size="16" font-weight="800">Готелі та тури в Україні</text>
      <text x="20" y="55" fill="#bae6fd" font-size="11">Бронюйте житло онлайн без комісій</text>

      <!-- Compact Search Bar -->
      <g transform="translate(15, 75)">
        <rect width="330" height="50" rx="8" fill="#ffffff" filter="url(#m-shadow)"/>
        <text x="15" y="22" fill="#64748b" font-size="9" font-weight="600">ПОШУК ЖИТЛА</text>
        <text x="15" y="38" fill="#0f172a" font-size="12">Куди прямуєте? (Карпати, Львів...)</text>
        <rect x="250" y="10" width="70" height="30" rx="6" fill="#0284c7"/>
        <text x="285" y="29" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">Пошук</text>
      </g>
    </g>

    <!-- Mobile Hotel Cards -->
    <g transform="translate(15, 245)">
      <text x="5" y="15" fill="#0f172a" font-size="14" font-weight="800">Популярні варіанти</text>

      <!-- Card 1 -->
      <g transform="translate(0, 25)">
        <rect width="330" height="190" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
        <rect width="330" height="95" rx="10" fill="#e0f2fe"/>
        <rect y="85" width="330" height="10" fill="#e0f2fe"/>
        <rect x="10" y="10" width="70" height="18" rx="4" fill="#16a34a"/>
        <text x="45" y="22" fill="#ffffff" font-size="9" font-weight="700" text-anchor="middle">ТОП ВИБІР</text>

        <text x="12" y="115" fill="#0284c7" font-size="9" font-weight="700">ЯРЕМЧЕ</text>
        <text x="12" y="130" fill="#0f172a" font-size="12" font-weight="700">Еко-шале «Смерековий край»</text>
        <text x="12" y="146" fill="#f59e0b" font-size="10">★ 4.9 (128)</text>
        <text x="12" y="172" fill="#0f172a" font-size="13" font-weight="800">2 800 ₴ <tspan fill="#64748b" font-size="9" font-weight="400">/ ніч</tspan></text>
        <rect x="235" y="158" width="85" height="24" rx="4" fill="#1e3a8a"/>
        <text x="277" y="174" fill="#ffffff" font-size="10" font-weight="600" text-anchor="middle">Бронювати</text>
      </g>

      <!-- Card 2 (Partially visible) -->
      <g transform="translate(0, 230)">
        <rect width="330" height="190" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
        <rect width="330" height="95" rx="10" fill="#ede9fe"/>
        <text x="12" y="115" fill="#0284c7" font-size="9" font-weight="700">КИЇВ</text>
        <text x="12" y="130" fill="#0f172a" font-size="12" font-weight="700">Готель «Дніпро Панорама»</text>
      </g>
    </g>

    <!-- Bottom Nav Bar -->
    <g transform="translate(0, 715)">
      <rect width="360" height="45" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      <text x="45" y="27" fill="#0284c7" font-size="10" font-weight="700" text-anchor="middle">🏠 Головна</text>
      <text x="135" y="27" fill="#64748b" font-size="10" text-anchor="middle">🔍 Пошук</text>
      <text x="225" y="27" fill="#64748b" font-size="10" text-anchor="middle">📋 Тарифи</text>
      <text x="315" y="27" fill="#64748b" font-size="10" text-anchor="middle">👤 Профіль</text>
    </g>
  </g>

  <!-- FRAME 2: Mobile Menu Open (Interactive State) -->
  <g transform="translate(480, 55)" filter="url(#m-shadow)">
    <!-- Label -->
    <text x="0" y="-8" fill="#94a3b8" font-size="12" font-weight="500">Frame 2: Mobile Menu Open (Drawer State)</text>

    <!-- Phone Body -->
    <rect width="360" height="760" rx="30" fill="#0f172a" stroke="#334155" stroke-width="4"/>

    <!-- Dimmed Background Overlay -->
    <rect width="360" height="760" rx="30" fill="#000000" opacity="0.6"/>

    <!-- Slide-in Navigation Drawer -->
    <g transform="translate(60, 0)">
      <rect width="300" height="760" rx="0" fill="#ffffff"/>
      
      <!-- Drawer Header -->
      <g transform="translate(25, 45)">
        <text x="0" y="20" fill="#1e3a8a" font-size="18" font-weight="800">Mandry<tspan fill="#0284c7">Stay</tspan></text>
        <!-- Close Button (X) -->
        <g transform="translate(225, 6)">
          <circle cx="10" cy="10" r="14" fill="#f1f5f9"/>
          <line x1="5" y1="5" x2="15" y2="15" stroke="#0f172a" stroke-width="2"/>
          <line x1="15" y1="5" x2="5" y2="15" stroke="#0f172a" stroke-width="2"/>
        </g>
      </g>
      <line x1="25" y1="85" x2="275" y2="85" stroke="#e2e8f0" stroke-width="1"/>

      <!-- Drawer Nav Links -->
      <g transform="translate(25, 115)" font-size="15" font-weight="600" fill="#0f172a">
        <text x="0" y="20" fill="#0284c7">🏠  Головна сторінка</text>
        <line x1="0" y1="35" x2="250" y2="35" stroke="#f1f5f9" stroke-width="1"/>
        <text x="0" y="65">🏨  Каталог готелів та шале</text>
        <line x1="0" y1="80" x2="250" y2="80" stroke="#f1f5f9" stroke-width="1"/>
        <text x="0" y="110">📊  Тарифи та порівняння</text>
        <line x1="0" y1="125" x2="250" y2="125" stroke="#f1f5f9" stroke-width="1"/>
        <text x="0" y="155">✍️  Онлайн-бронювання</text>
        <line x1="0" y1="170" x2="250" y2="170" stroke="#f1f5f9" stroke-width="1"/>
        <text x="0" y="200">📄  Резюме розробника</text>
      </g>

      <!-- Drawer Footer Action -->
      <g transform="translate(25, 630)">
        <rect width="250" height="44" rx="8" fill="#1e3a8a"/>
        <text x="125" y="27" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">Зв'язатися з менеджером</text>
        <text x="125" y="60" fill="#64748b" font-size="11" text-anchor="middle">+38 (067) 123-45-67</text>
      </g>
    </g>
  </g>
</svg>