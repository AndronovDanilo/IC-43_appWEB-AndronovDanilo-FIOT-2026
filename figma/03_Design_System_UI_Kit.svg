<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 680" width="1100" height="680" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <filter id="ds-shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="objectBoundingBox">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1100" height="680" fill="#1e1e1e"/>

  <!-- Top Title -->
  <g transform="translate(40, 25)">
    <rect x="0" y="0" width="24" height="20" rx="3" fill="#0d99ff"/>
    <text x="7" y="15" fill="#ffffff" font-size="12" font-weight="900">❖</text>
    <text x="32" y="15" fill="#ffffff" font-size="16" font-weight="700">MandryStay / Design System &amp; UI Kit (Figma Specs)</text>
    <rect x="520" y="2" width="150" height="18" rx="9" fill="#2c2c2c"/>
    <text x="595" y="15" fill="#38bdf8" font-size="11" font-weight="500" text-anchor="middle">Design Tokens &amp; Components</text>
  </g>

  <!-- Container -->
  <g transform="translate(40, 60)" filter="url(#ds-shadow)">
    <rect width="1020" height="580" rx="8" fill="#ffffff"/>

    <!-- 1. Color Palette Tokens -->
    <g transform="translate(30, 25)">
      <text x="0" y="15" fill="#0f172a" font-size="15" font-weight="800">1. Колірна палітра (Color Tokens)</text>
      
      <!-- Primary Blue -->
      <g transform="translate(0, 30)">
        <rect width="140" height="70" rx="6" fill="#1e3a8a"/>
        <text x="10" y="90" fill="#0f172a" font-size="11" font-weight="700">Primary Blue</text>
        <text x="10" y="105" fill="#64748b" font-size="10">#1E3A8A</text>
      </g>

      <!-- Accent Sky -->
      <g transform="translate(160, 30)">
        <rect width="140" height="70" rx="6" fill="#0284c7"/>
        <text x="10" y="90" fill="#0f172a" font-size="11" font-weight="700">Accent Sky</text>
        <text x="10" y="105" fill="#64748b" font-size="10">#0284C7</text>
      </g>

      <!-- Dark Slate -->
      <g transform="translate(320, 30)">
        <rect width="140" height="70" rx="6" fill="#0f172a"/>
        <text x="10" y="90" fill="#0f172a" font-size="11" font-weight="700">Dark Slate (Text)</text>
        <text x="10" y="105" fill="#64748b" font-size="10">#0F172A</text>
      </g>

      <!-- Neutral Surface -->
      <g transform="translate(480, 30)">
        <rect width="140" height="70" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
        <text x="10" y="90" fill="#0f172a" font-size="11" font-weight="700">Surface Bg</text>
        <text x="10" y="105" fill="#64748b" font-size="10">#F8FAFC</text>
      </g>

      <!-- Success Green -->
      <g transform="translate(640, 30)">
        <rect width="140" height="70" rx="6" fill="#16a34a"/>
        <text x="10" y="90" fill="#0f172a" font-size="11" font-weight="700">Success Green</text>
        <text x="10" y="105" fill="#64748b" font-size="10">#16A34A</text>
      </g>

      <!-- Warning Amber -->
      <g transform="translate(800, 30)">
        <rect width="140" height="70" rx="6" fill="#f59e0b"/>
        <text x="10" y="90" fill="#0f172a" font-size="11" font-weight="700">Warning Rating</text>
        <text x="10" y="105" fill="#64748b" font-size="10">#F59E0B</text>
      </g>
    </g>

    <line x1="30" y1="170" x2="990" y2="170" stroke="#e2e8f0" stroke-width="1"/>

    <!-- 2. Typography Scale -->
    <g transform="translate(30, 195)">
      <text x="0" y="15" fill="#0f172a" font-size="15" font-weight="800">2. Типографіка (Inter Font Family)</text>
      
      <g transform="translate(0, 35)">
        <text x="0" y="25" fill="#0f172a" font-size="28" font-weight="800">H1 Display / 28px Bold</text>
        <text x="450" y="25" fill="#64748b" font-size="12">font-size: 1.75rem (28px) · line-height: 1.2 · weight: 800</text>
      </g>

      <g transform="translate(0, 80)">
        <text x="0" y="20" fill="#0f172a" font-size="20" font-weight="700">H2 Section Heading / 20px Bold</text>
        <text x="450" y="20" fill="#64748b" font-size="12">font-size: 1.25rem (20px) · line-height: 1.3 · weight: 700</text>
      </g>

      <g transform="translate(0, 120)">
        <text x="0" y="15" fill="#334155" font-size="15" font-weight="400">Body Text / 15px Regular: Швидке та надійне бронювання готелів.</text>
        <text x="450" y="15" fill="#64748b" font-size="12">font-size: 0.95rem (15px) · line-height: 1.6 · weight: 400</text>
      </g>
    </g>

    <line x1="30" y1="365" x2="990" y2="365" stroke="#e2e8f0" stroke-width="1"/>

    <!-- 3. Component Specs (Buttons & Form Fields) -->
    <g transform="translate(30, 390)">
      <text x="0" y="15" fill="#0f172a" font-size="15" font-weight="800">3. Компонентна бібліотека (UI Components)</text>

      <!-- Buttons -->
      <g transform="translate(0, 35)">
        <!-- Default Primary -->
        <rect x="0" y="0" width="130" height="38" rx="6" fill="#1e3a8a"/>
        <text x="65" y="24" fill="#ffffff" font-size="12" font-weight="600" text-anchor="middle">Btn Primary</text>
        <text x="65" y="52" fill="#64748b" font-size="10" text-anchor="middle">Default State</text>

        <!-- Hover State -->
        <rect x="150" y="0" width="130" height="38" rx="6" fill="#2563eb"/>
        <text x="215" y="24" fill="#ffffff" font-size="12" font-weight="600" text-anchor="middle">Btn Hover</text>
        <text x="215" y="52" fill="#64748b" font-size="10" text-anchor="middle">:hover (+20% br)</text>

        <!-- Secondary Outline -->
        <rect x="300" y="0" width="130" height="38" rx="6" fill="#ffffff" stroke="#1e3a8a" stroke-width="1.5"/>
        <text x="365" y="24" fill="#1e3a8a" font-size="12" font-weight="600" text-anchor="middle">Btn Outline</text>
        <text x="365" y="52" fill="#64748b" font-size="10" text-anchor="middle">Secondary State</text>

        <!-- Chips -->
        <g transform="translate(460, 5)">
          <rect x="0" y="0" width="80" height="26" rx="13" fill="#e0f2fe"/>
          <text x="40" y="17" fill="#0284c7" font-size="10" font-weight="700" text-anchor="middle">Active Chip</text>
          
          <rect x="95" y="0" width="80" height="26" rx="13" fill="#f1f5f9"/>
          <text x="135" y="17" fill="#64748b" font-size="10" font-weight="600" text-anchor="middle">Default Chip</text>
        </g>
      </g>

      <!-- Form Inputs -->
      <g transform="translate(0, 110)">
        <!-- Default input -->
        <g transform="translate(0, 0)">
          <text x="0" y="-8" fill="#64748b" font-size="11" font-weight="600">INPUT / DEFAULT</text>
          <rect x="0" y="0" width="280" height="38" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
          <text x="12" y="24" fill="#94a3b8" font-size="12">Введіть адресу або місто...</text>
        </g>

        <!-- Focused input with ring -->
        <g transform="translate(310, 0)">
          <text x="0" y="-8" fill="#0284c7" font-size="11" font-weight="600">INPUT / FOCUS STATE</text>
          <rect x="0" y="0" width="280" height="38" rx="6" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
          <text x="12" y="24" fill="#0f172a" font-size="12">Яремче, Буковель</text>
        </g>

        <!-- Select dropdown -->
        <g transform="translate(620, 0)">
          <text x="0" y="-8" fill="#64748b" font-size="11" font-weight="600">SELECT DROPDOWN</text>
          <rect x="0" y="0" width="280" height="38" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
          <text x="12" y="24" fill="#0f172a" font-size="12">2 дорослих · 1 кімната</text>
          <text x="260" y="24" fill="#64748b" font-size="11">▼</text>
        </g>
      </g>
    </g>
  </g>
</svg>